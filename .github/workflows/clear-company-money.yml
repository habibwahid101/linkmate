name: Clear company ID money

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "0=inventory only. 1=zero balance and commission on the three company IDs."
        required: true
        default: "0"

concurrency:
  group: aws-prod-inspect
  cancel-in-progress: false

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
      EC2_INSTANCE_ID: i-0d5882a956e4d3981
      TF_GITHUB_DEPLOY_ROLE_ARN: arn:aws:iam::364410974458:role/linkmate-prod-github-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        id: assume
        continue-on-error: true
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Assume Terraform GitHub deploy role
        if: steps.assume.outcome != 'success'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Inventory or clear
        env:
          APPLY: ${{ github.event.inputs.apply }}
        run: |
          set -euo pipefail
          INSTANCE="$EC2_INSTANCE_ID"
          python3 - <<'PY'
          import json, os, pathlib
          script = pathlib.Path("scripts/clear-company-money.mjs").read_text()
          apply = os.environ.get("APPLY") == "1"
          run = (
              "docker exec -e CONFIRM=CLEAR-COMPANY-MONEY -w /app "
              "linkmate node scripts/clear-company-money.mjs --apply"
              if apply else
              "docker exec -w /app linkmate node scripts/clear-company-money.mjs"
          )
          commands = [
              "set -euo pipefail",
              "cat > /tmp/clear-company-money.mjs << 'ENDSCRIPT'\n" + script + "\nENDSCRIPT",
              "docker cp /tmp/clear-company-money.mjs linkmate:/app/scripts/clear-company-money.mjs",
              run,
          ]
          pathlib.Path("/tmp/ssm-params.json").write_text(json.dumps({"commands": commands}))
          PY
          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --comment "Link Mate clear company money" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "Waiting for SSM $CMD"
          for i in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            echo "status=$STATUS"
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" --query "[Status,StandardOutputContent,StandardErrorContent]" --output text
              [ "$STATUS" = "Success" ]
              exit $?
            fi
            sleep 5
          done
          echo "SSM timed out"
          exit 1
