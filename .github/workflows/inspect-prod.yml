name: Inspect production shell

on:
  workflow_dispatch:

concurrency:
  group: aws-prod-inspect
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
      EC2_INSTANCE_ID: i-0d5882a956e4d3981
      ADMIN_EMAIL: hello.habibwahid@gmail.com
    steps:
      - name: Diagnose GitHub OIDC claims
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain OIDC token"
            exit 1
          fi
          PAYLOAD=$(printf '%s' "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          CLAIMS=$(printf '%s' "$PAYLOAD" | base64 -d)
          echo "=== OIDC non-secret claims (sts.amazonaws.com audience) ==="
          echo "$CLAIMS" | jq -r '
            "sub=\(.sub // "null")",
            "aud=\(.aud // "null")",
            "iss=\(.iss // "null")",
            "repository=\(.repository // "null")",
            "repository_id=\(.repository_id // "null")",
            "repository_owner=\(.repository_owner // "null")",
            "repository_owner_id=\(.repository_owner_id // "null")",
            "ref=\(.ref // "null")",
            "environment=\(.environment // "null")"
          '
          EXPECTED="arn:aws:iam::364410974458:role/linkmate-prod-github-deploy"
          if [ "${{ secrets.AWS_ROLE_ARN }}" = "$EXPECTED" ]; then
            echo "AWS_ROLE_ARN_MATCH=yes"
          else
            echo "AWS_ROLE_ARN_MATCH=no"
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: SSM inspect owner + recent app logs
        run: |
          set -euo pipefail
          INSTANCE="$EC2_INSTANCE_ID"
          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --comment "Link Mate inspect owner shell" \
            --parameters "commands=[
              \"set -euo pipefail\",
              \"echo VERSION\",
              \"curl -fsS -m 8 http://127.0.0.1/api/version || true\",
              \"echo HEALTH\",
              \"curl -fsS -m 8 http://127.0.0.1/api/health || true\",
              \"echo READY\",
              \"curl -fsS -m 8 http://127.0.0.1/api/readiness || true\",
              \"echo INSPECT\",
              \"docker exec -e ADMIN_EMAIL=$ADMIN_EMAIL linkmate node scripts/inspect-owner.mjs\",
              \"echo LOGS\",
              \"docker logs --tail 250 linkmate 2>&1 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[email]/g; s/postgres(ql)?:\\/\\/[^ ]+/postgres:\\/\\/[redacted]/g' | tail -n 250\"
            ]" \
            --query "Command.CommandId" --output text)
          echo "Waiting for SSM $CMD"
          for i in $(seq 1 24); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            echo "status=$STATUS"
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" --query "[Status,StandardOutputContent,StandardErrorContent]" --output text
              [ "$STATUS" = "Success" ]
              exit $?
            fi
            sleep 5
          done
          echo "SSM timed out"
          exit 1
