name: Inspect production shell

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Set to 1 to apply missing HELD memberships/commissions. Default 0 is dry-run. Never reverses RELEASED wallets."
        required: false
        default: "0"

concurrency:
  group: aws-prod-inspect
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
      EC2_INSTANCE_ID: i-0d5882a956e4d3981
      ADMIN_EMAIL: hello.habibwahid@gmail.com
      # Account and role name are already public in prior deploy logs / Terraform.
      TF_GITHUB_DEPLOY_ROLE_ARN: arn:aws:iam::364410974458:role/linkmate-prod-github-deploy
    steps:
      - name: Diagnose GitHub OIDC claims
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain OIDC token"
            exit 1
          fi
          PAYLOAD=$(printf '%s' "$TOKEN" | cut -d. -f2 | tr '_-' '/+' )
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          CLAIMS=$(printf '%s' "$PAYLOAD" | base64 -d)
          echo "=== OIDC non-secret claims (sts.amazonaws.com audience) ==="
          echo "$CLAIMS" | jq -r '
            "sub=\(.sub // "null")",
            "aud=\(.aud // "null")",
            "iss=\(.iss // "null")",
            "repository=\(.repository // "null")",
            "repository_id=\(.repository_id // "null")",
            "repository_owner=\(.repository_owner // "null")",
            "repository_owner_id=\(.repository_owner_id // "null")",
            "ref=\(.ref // "null")",
            "event_name=\(.event_name // "null")",
            "environment=\(.environment // "null")",
            "job_workflow_ref=\(.job_workflow_ref // "null")"
          '
          echo "secret_role_set=$([ -n "${AWS_ROLE_ARN:-}" ] && echo yes || echo no)"
          echo "tf_role=$TF_GITHUB_DEPLOY_ROLE_ARN"
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      - uses: aws-actions/configure-aws-credentials@v4
        id: assume
        continue-on-error: true
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Assume Terraform GitHub deploy role
        if: steps.assume.outcome != 'success'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Who am I
        run: aws sts get-caller-identity --query '{Account:Account,Arn:Arn}' --output json
      - name: SSM generation reconcile
        env:
          APPLY: ${{ github.event.inputs.apply || '0' }}
        run: |
          set -euo pipefail
          INSTANCE="$EC2_INSTANCE_ID"
          APPLY_FLAG="$APPLY"
          if [ "$APPLY_FLAG" != "1" ]; then APPLY_FLAG=0; fi
          echo "reconcile APPLY=$APPLY_FLAG"
          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --comment "Link Mate generation reconcile APPLY=$APPLY_FLAG" \
            --timeout-seconds 600 \
            --parameters "commands=[
              \"set -euo pipefail\",
              \"echo VERSION\",
              \"curl -fsS -m 8 http://127.0.0.1/api/version || true\",
              \"echo HEALTH\",
              \"curl -fsS -m 8 http://127.0.0.1/api/health || true\",
              \"echo FILES\",
              \"docker exec linkmate ls -la scripts/reconcile-generation.mjs src/lib/engine/process.ts src/lib/rules.ts\",
              \"echo RECONCILE\",
              \"docker exec -e APPLY=$APPLY_FLAG linkmate node --experimental-strip-types scripts/reconcile-generation.mjs\"
            ]" \
            --query "Command.CommandId" --output text)
          echo "Waiting for SSM $CMD"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            echo "status=$STATUS"
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" --query "[Status,StandardOutputContent,StandardErrorContent]" --output text
              [ "$STATUS" = "Success" ]
              exit $?
            fi
            sleep 5
          done
          echo "SSM timed out"
          exit 1
