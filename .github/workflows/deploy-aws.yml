name: AWS production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aws-prod
  cancel-in-progress: false

jobs:
  test:
    name: typecheck + tests + node-server build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:app
      - run: npm run build:aws
      - run: npm run test:boot:aws

  deploy:
    name: ECR + EC2
    needs: test
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
      EC2_INSTANCE_ID: i-0d5882a956e4d3981
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      - name: Build and push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE: linkmate-prod
        run: |
          docker build --build-arg LINKMATE_BUILD_COMMIT=${{ github.sha }} -t "$ECR_REGISTRY/$IMAGE:${{ github.sha }}" -t "$ECR_REGISTRY/$IMAGE:latest" .
          docker push "$ECR_REGISTRY/$IMAGE:${{ github.sha }}"
          docker push "$ECR_REGISTRY/$IMAGE:latest"
      - name: Cleanup failed App Runner services
        continue-on-error: true
        run: |
          set +e
          aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='linkmate-prod']" --output json > /tmp/apr.json || echo '[]' > /tmp/apr.json
          cat /tmp/apr.json
          ARN=$(jq -r '.[0].ServiceArn // empty' /tmp/apr.json)
          STATUS=$(jq -r '.[0].Status // empty' /tmp/apr.json)
          if [ -n "$ARN" ] && echo "$STATUS" | grep -Eq 'CREATE_FAILED|DELETE_FAILED|PAUSED'; then
            aws apprunner delete-service --service-arn "$ARN" || true
          fi
      - name: Deploy to EC2 via SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          INSTANCE="$EC2_INSTANCE_ID"
          echo "INSTANCE=$INSTANCE" >> "$GITHUB_ENV"
          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --comment "Link Mate RDS CA + deploy $IMAGE_TAG" \
            --parameters "commands=[
              \"set -euo pipefail\",
              \"install -d -m 0755 /opt/linkmate /opt/linkmate/certs\",
              \"curl -fsSL -o /opt/linkmate/certs/global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem\",
              \"curl -fsSL -o /opt/linkmate/deploy.sh https://raw.githubusercontent.com/habibwahid101/linkmate/main/infra/aws/ec2-deploy.sh\",
              \"chmod 0755 /opt/linkmate/deploy.sh\",
              \"sed -i 's|^export LM_TAG=.*|export LM_TAG=$IMAGE_TAG|' /opt/linkmate/env.sh || echo export LM_TAG=$IMAGE_TAG >> /opt/linkmate/env.sh\",
              \"/opt/linkmate/deploy.sh\",
              \"docker inspect --format='{{.State.Status}} {{.Config.Image}}' linkmate\",
              \"sleep 8\",
              \"curl -fsS -m 10 http://127.0.0.1/api/health || true\",
              \"curl -fsS -m 10 http://127.0.0.1/api/readiness || true\"
            ]" \
            --query "Command.CommandId" --output text)
          echo "Waiting for SSM $CMD on $INSTANCE"
          for i in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            echo "status=$STATUS"
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" --query "[StandardOutputContent,StandardErrorContent]" --output text
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" --query "[Status,StandardOutputContent,StandardErrorContent]" --output text
              exit 1
            fi
            sleep 10
          done
          echo "SSM timed out"
          exit 1
      - name: Probe public health
        if: env.INSTANCE != ''
        run: |
          echo "PUBLIC_URL=https://linkmateglobal.com"
          sleep 5
          for path in /api/health /api/readiness /; do
            echo "GET https://linkmateglobal.com$path"
            curl -fsS -m 20 "https://linkmateglobal.com$path" || echo "probe_failed path=$path"
          done
      - name: Provision owner admin
        if: env.INSTANCE != ''
        env:
          ADMIN_EMAIL: hello.habibwahid@gmail.com
        run: |
          set -euo pipefail
          INSTANCE="$EC2_INSTANCE_ID"
          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --comment "Provision Link Mate admin $ADMIN_EMAIL" \
            --parameters "commands=[
              \"set -euo pipefail\",
              \"docker exec -e ADMIN_EMAIL=$ADMIN_EMAIL linkmate node scripts/provision-admin.mjs\"
            ]" \
            --query "Command.CommandId" --output text)
          echo "Waiting for provision SSM $CMD"
          for i in $(seq 1 24); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            echo "status=$STATUS"
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" --query StandardOutputContent --output text
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE" --query "[Status,StandardOutputContent,StandardErrorContent]" --output text
              exit 1
            fi
            sleep 8
          done
          echo "provision SSM timed out"
          exit 1
