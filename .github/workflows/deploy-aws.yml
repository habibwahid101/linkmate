name: AWS production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aws-prod
  cancel-in-progress: false

jobs:
  test:
    name: typecheck + tests + node-server build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:app
      - run: npm run build:aws
      - run: npm run test:boot:aws

  deploy:
    name: ECR + App Runner
    needs: test
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose GitHub OIDC claims
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain OIDC token"
            exit 1
          fi
          # Decode JWT payload only (middle segment). Do not print the raw JWT.
          PAYLOAD=$(printf '%s' "$TOKEN" | cut -d. -f2 | tr '_-' '/+' )
          # Pad base64 if needed
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          CLAIMS=$(printf '%s' "$PAYLOAD" | base64 -d 2>/dev/null || printf '%s' "$PAYLOAD" | base64 -d)
          echo "=== OIDC non-secret claims (sts.amazonaws.com audience) ==="
          echo "$CLAIMS" | jq -r '
            "sub=\(.sub // "null")",
            "aud=\(.aud // "null")",
            "repository=\(.repository // "null")",
            "repository_id=\(.repository_id // "null")",
            "repository_owner=\(.repository_owner // "null")",
            "repository_owner_id=\(.repository_owner_id // "null")",
            "ref=\(.ref // "null")",
            "environment=\(.environment // "null")"
          '
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      - name: Build and push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE: linkmate-prod
        run: |
          docker build --build-arg LINKMATE_BUILD_COMMIT=${{ github.sha }} -t "$ECR_REGISTRY/$IMAGE:${{ github.sha }}" -t "$ECR_REGISTRY/$IMAGE:latest" .
          docker push "$ECR_REGISTRY/$IMAGE:${{ github.sha }}"
          docker push "$ECR_REGISTRY/$IMAGE:latest"
      - name: Update App Runner if it exists
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          SERVICE=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='linkmate-prod'].ServiceArn" --output text)
          if [ -z "$SERVICE" ] || [ "$SERVICE" = "None" ]; then
            echo "App Runner service not created yet. Run terraform apply -var enable_app_runner=true after the first image exists."
            exit 0
          fi
          aws apprunner start-deployment --service-arn "$SERVICE"
